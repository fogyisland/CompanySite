# ============================================================
# 博铭科技 www.booming.one  Nginx 配置（生产 v2）
# 替换 /www/server/panel/vhost/nginx/www.booming.one.conf
#
# 改动要点（相对宝塔默认模板）：
# - 拿掉 catch-all `location ^~ / { proxy_pass ... }`
# - 静态资源全部走 Nginx alias 直出，避开 Node 进程切换
# - HTML 走 no-cache（带 ETag revalidate），改了能立即拿到
# - JS/CSS/图片/字体走 7d immutable（带版本戳 ?v= 的资源可永久缓存）
# - /api/ 走 Node（不缓存）
# - 保留宝塔的 SSL、证书验证、日志、敏感文件屏蔽规则
# ============================================================

proxy_cache_path /www/www/proxy_cache_dir levels=1:2 keys_zone=www_booming_one_cache:20m inactive=1d max_size=5g;

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    listen [::]:80;
    listen [::]:443 ssl;
    server_name www.booming.one;

    # 项目根目录（注意：所有 HTML 在 public 根目录，所以这里 alias 要用 $uri + 路径）
    root /www/www/public;
    index index.html;

    # ---------- 宝塔 SSL 证书申请验证（保留） ----------
    include /www/server/panel/vhost/nginx/well-known/www.booming.one.conf;

    # ---------- SSL ----------
    ssl_certificate     /www/server/panel/vhost/cert/www.booming.one/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.booming.one/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;

    # ---------- 通用安全头 ----------
    add_header X-Frame-Options        "SAMEORIGIN"           always;
    add_header X-Content-Type-Options "nosniff"              always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---------- gzip ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ---------- 日志 ----------
    access_log /www/wwwlogs/www.booming.one.log;
    error_log  /www/wwwlogs/www.booming.one.error.log;

    # ---------- client_max_body_size（用户上传） ----------
    client_max_body_size 20M;

    # ============================================================
    # 静态资源直出 —— 避开 Node 进程
    # 带 ?v=YYYYMMDD 版本戳的资源可永久缓存
    # ============================================================
    # JS / CSS / 第三方库：7d immutable（文件名不变 → 内容不变）
    location ^~ /js/      { alias /www/www/public/js/;      add_header Cache-Control "public, max-age=604800, immutable"; access_log off; }
    location ^~ /css/     { alias /www/www/public/css/;     add_header Cache-Control "public, max-age=604800, immutable"; access_log off; }
    location ^~ /vendor/  { alias /www/www/public/vendor/;  add_header Cache-Control "public, max-age=604800, immutable"; access_log off; }
    # 用户上传：文件名不变但内容会被覆盖 → no-cache + ETag revalidate
    location ^~ /uploads/ { alias /www/www/public/uploads/; add_header Cache-Control "no-cache, must-revalidate";       access_log off; }

    # 其他带扩展名静态文件（根目录的 logo.png / favicon.ico 等）—— 7d immutable
    location ~* \.(png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot|map)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ============================================================
    # HTML 直出 —— no-cache（带 ETag revalidation）
    # express.static 已在 server.js 设 ETag，Nginx 文件系统 stat 即可 304
    # ============================================================
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options        "SAMEORIGIN"           always;
        add_header X-Content-Type-Options "nosniff"              always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # ============================================================
    # API 走 Node（无缓存）
    # ============================================================
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:15000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Real-Port       $remote_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header REMOTE-HOST       $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # ============================================================
    # 兜底：根 / 与其他动态路径走 Node（HTML 同样 no-cache）
    # ============================================================
    location / {
        proxy_pass http://127.0.0.1:15000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Real-Port       $remote_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header REMOTE-HOST       $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        # 拿掉上游的 Cache-Control，自己加 no-cache
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---------- 宝塔 SSL 证书申请验证目录（保留） ----------
    location /.well-known { allow all; }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) { return 403; }

    # ---------- 禁止访问敏感文件 / 目录（保留宝塔规则） ----------
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$ { return 404; }
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ { return 404; }
}
