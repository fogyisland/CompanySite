<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博铭科技 - 结算中心</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/themes/theme-variables.css">
  <style>
    .checkout-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .checkout-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 32px;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 32px;
    }
    @media (max-width: 768px) {
      .checkout-grid {
        grid-template-columns: 1fr;
      }
    }
    .checkout-card {
      background: var(--white);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    }
    .checkout-card h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      color: var(--text);
    }
    .order-item {
      display: flex;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .order-item:last-child {
      border-bottom: none;
    }
    .order-item-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: var(--white);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      margin-right: 18px;
      box-shadow: 0 4px 12px rgba(19, 60, 138, 0.25);
    }
    .order-item-info {
      flex: 1;
    }
    .order-item-name {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      font-size: 15px;
    }
    .order-item-meta {
      font-size: 13px;
      color: var(--text-light);
    }
    .order-item-price {
      font-size: 20px;
      font-weight: 600;
      color: var(--primary);
    }
    .order-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 0;
      font-size: 20px;
      font-weight: 600;
    }
    .order-total .amount {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }
    .payment-info {
      background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
      border: 1px solid #ffc107;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .payment-info h4 {
      color: #e65100;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 600;
    }
    .payment-info p {
      color: #333;
      font-size: 14px;
      line-height: 1.8;
    }
    .wechat-id {
      font-weight: 600;
      color: var(--primary);
      font-size: 16px;
    }
    .verification-form {
      margin-top: 24px;
    }
    .verification-form input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .verification-form input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(19, 60, 138, 0.12);
    }
    .btn-wechat {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #07c160 0%, #06ad56 100%);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(7, 193, 96, 0.3);
    }
    .btn-wechat:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(7, 193, 96, 0.4);
    }
    .message {
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      display: none;
      font-size: 14px;
    }
    .message.success {
      background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
      color: #065f46;
      border: 1px solid #a7f3d0;
      display: block;
    }
    .message.error {
      background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block;
    }
    .message.info {
      background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
      color: #1976d2;
      border: 1px solid #90caf9;
      display: block;
    }
    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--text-light);
    }
    .login-prompt {
      text-align: center;
      padding: 48px;
    }
    .login-prompt h3 {
      margin-bottom: 20px;
      font-size: 20px;
    }
    .login-prompt a {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: var(--white);
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(19, 60, 138, 0.3);
    }
    .login-prompt a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(19, 60, 138, 0.4);
    }
    .cart-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      background: linear-gradient(135deg, rgba(19, 60, 138, 0.04) 0%, rgba(19, 60, 138, 0.08) 100%);
      border-radius: 12px;
      margin-bottom: 24px;
      border: 1px solid rgba(19, 60, 138, 0.08);
    }
    .cart-summary-items {
      font-size: 14px;
      color: var(--text-light);
    }
    .cart-summary-total {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary);
    }
    .order-list {
      margin-bottom: 24px;
    }
    .order-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
    }
    .order-card-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .order-card-header .order-id {
      font-weight: bold;
      color: var(--text);
    }
    .order-card-header .order-status {
      color: #ff9800;
      font-size: 13px;
    }
  </style>
  <!-- 安全渲染工具：转义 / 地址白名单的唯一事实来源（public/js/safe-html.js） -->
  <script src="/js/safe-html.js?v=1"></script>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        <div class="logo-icon" id="header-logo-icon">SV</div>
        <span class="logo-text" id="header-logo-text">博铭科技</span>
      </a>
      <nav>
        <ul>
          <li><a href="/product/">产品中心</a></li>
          <li><a href="/#features">特点</a></li>
          <li><a href="/support">支持</a></li>
          <li><a href="/contact">联系</a></li>
          <li><a href="/news.html">动态</a></li>
          <li><a href="https://blog.booming.one" target="_blank">博客</a></li>
          <li><a href="/about">关于</a></li>
        </ul>
      </nav>
      <div class="header-actions" id="header-actions">
        <button class="header-cart" onclick="renderCartModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h19.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span id="cart-badge" class="cart-badge" style="display:none;">0</span>
        </button>
        <a href="/login" class="header-login" id="header-login">登录</a>
        <a href="#" class="header-logout" id="header-logout" style="display:none;" onclick="headerLogout()">退出</a>
      </div>
    </div>
  </header>

  <main class="checkout-container" id="checkout-content">
    <!-- Content loaded dynamically -->
  </main>

  <script src="/js/cart.js"></script>
  <script>
    let currentOrders = [];
    let cartItems = [];

    async function loadSiteSettings() {
      try {
        const response = await fetch('/api/settings');
        const settings = await response.json();

        if (settings.companyName) {
          document.getElementById('header-logo-text').textContent = settings.companyName;
          document.title = settings.companyName + ' - 结算中心';
        }

        // Logo 地址先过白名单再转义 —— 管理员可控的字段不能直接拼进 HTML。
        const logoUrl = SafeHtml.escapeHtml(SafeHtml.safeImageUrl(settings.logo));
        if (logoUrl) {
          document.getElementById('header-logo-icon').outerHTML =
            '<img src="' + logoUrl + '" alt="Logo" id="header-logo-icon" style="height:40px;width:auto;">';
        }
      } catch (error) {
        console.error('Error loading settings:', error);
      }
    }

    async function loadCheckout() {
      await loadSiteSettings();
      // 检查用户是否登录
      const authResponse = await fetch('/api/auth/me', { credentials: 'include' });
      const authData = await authResponse.json();

      if (!authData.loggedIn) {
        document.getElementById('checkout-content').innerHTML = `
          <h1 class="checkout-title">结算中心</h1>
          <div class="checkout-card login-prompt">
            <h3>请先登录</h3>
            <p style="margin-bottom: 20px; color: var(--text-light);">您需要登录后才能购买产品</p>
            <a href="/login">立即登录</a>
          </div>
        `;
        return;
      }

      // 获取购物车内容
      cartItems = getCart();

      if (cartItems.length === 0) {
        document.getElementById('checkout-content').innerHTML = `
          <h1 class="checkout-title">结算中心</h1>
          <div class="checkout-card">
            <div class="empty-state">
              <h3>购物车为空</h3>
              <p>请选择要购买的产品</p>
              <a href="/" style="color: var(--primary);">返回首页</a>
            </div>
          </div>
        `;
        return;
      }

      // 为每个购物车项创建订单
      currentOrders = [];
      // 下单失败的项：产品可能已被下架（草稿）或价格方案已变更。
      // 不能静默丢弃 —— 否则用户会看到「购物车清空了但一个订单都没生成」。
      const failedItems = [];
      for (const item of cartItems) {
        try {
          const orderResponse = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              items: [{
                productId: item.productId,
                name: item.name,
                price: item.price,
                duration: item.duration,
                tierIndex: item.tierIndex,
                quantity: item.quantity
              }],
              totalAmount: item.price * item.quantity
            }),
            credentials: 'include'
          });
          const order = await orderResponse.json();
          if (order.id) {
            currentOrders.push({ ...order, item });
          } else {
            failedItems.push({ item, reason: order.error || '下单失败，请稍后重试' });
          }
        } catch (error) {
          console.error('Error creating order:', error);
          failedItems.push({ item, reason: '网络错误，请稍后重试' });
        }
      }

      // 只清掉成功下单的项；失败的项留在购物车里，用户可以重试或自行移除
      if (currentOrders.length > 0) {
        removeSucceededFromCart(
          currentOrders.map((order) => ({ productId: order.item.productId, tierIndex: order.item.tierIndex }))
        );
      }

      // 渲染结算页面
      renderCheckoutPage(failedItems);
    }

    /**
     * HTML 转义 —— 统一走 SafeHtml（public/js/safe-html.js），那里是唯一事实来源。
     * 商品名来自 localStorage 购物车（可被用户改写），拼进 innerHTML 前必须转义。
     */
    function escapeHtml(text) {
      return SafeHtml.escapeHtml(text);
    }

    /**
     * 从购物车里移除已成功下单的项。
     * 失败的项必须留着 —— 否则用户会看到购物车凭空清空。
     * getCart 的 JSON.parse 也要兜底：localStorage 被写坏时不能整页崩掉。
     */
    function removeSucceededFromCart(succeededList) {
      const succeeded = new Set(succeededList.map((item) => `${item.productId}:${item.tierIndex}`));
      let cart = [];
      try {
        cart = getCart();
      } catch (parseError) {
        console.error('购物车数据损坏，已按空购物车处理:', parseError);
        saveCart([]);
        return;
      }
      const remaining = cart.filter((item) => !succeeded.has(`${item.productId}:${item.tierIndex}`));
      saveCart(remaining);
    }

    function renderCheckoutPage(failedItems) {
      const failures = Array.isArray(failedItems) ? failedItems : [];
      const totalAmount = currentOrders.reduce((sum, order) => sum + order.totalAmount, 0);

      // 后端返回的是稳定错误码（便于日志聚合），这里翻成用户看得懂的话
      const ERROR_TEXT = {
        PRODUCT_NOT_FOUND: '产品不存在',
        PRODUCT_NOT_AVAILABLE: '产品已下架，暂时无法购买',
        PRICE_NOT_AVAILABLE: '价格信息有误，请联系客服',
        TIER_NOT_AVAILABLE: '价格方案已调整，请重新选择',
        TIER_OUT_OF_RANGE: '价格方案已调整，请重新选择',
        INVALID_TIER_INDEX: '价格方案已调整，请重新选择'
      };

      const failureBlock = failures.length > 0 ? `
        <div class="checkout-card" style="border-left:4px solid #ef4444;margin-bottom:20px;">
          <h3 style="color:#ef4444;margin-bottom:10px;">以下商品未能下单</h3>
          <ul style="list-style:none;padding:0;margin:0;">
            ${failures.map(({ item, reason }) => `
              <li style="padding:8px 0;border-bottom:1px solid rgba(148,163,184,.15);">
                <strong>${escapeHtml(item.name)}</strong>
                <span style="color:#ef4444;margin-left:8px;">${escapeHtml(ERROR_TEXT[reason] || reason)}</span>
              </li>
            `).join('')}
          </ul>
          <p style="margin-top:12px;color:var(--text-light);font-size:13px;">
            这些商品仍保留在购物车中，可移除后重新结算。
          </p>
        </div>
      ` : '';

      document.getElementById('checkout-content').innerHTML = `
        <h1 class="checkout-title">结算中心</h1>

        ${failureBlock}

        <div class="cart-summary">
          <div class="cart-summary-items">
            共 ${currentOrders.length} 个订单（每个订单将单独结算）
          </div>
          <div class="cart-summary-total">
            合计：¥${totalAmount}
          </div>
        </div>

        <div class="order-list">
          ${currentOrders.map(order => {
            // item 来自 localStorage 购物车（用户可改写），每个字段都要转义；
            // 数值字段先归一成数字，缺字段时显示 0 而不是 NaN
            const item = order.item || {};
            const price = Number(item.price) || 0;
            const quantity = Number(item.quantity) || 0;
            const icon = String(item.icon || (item.name || '').charAt(0) || '📦');
            return `
            <div class="order-card">
              <div class="order-card-header">
                <span class="order-id">${escapeHtml(order.orderNumber || ('订单 #' + order.id))}</span>
                <span class="order-status">待支付</span>
              </div>
              <div class="order-item">
                <div class="order-item-icon">${escapeHtml(icon)}</div>
                <div class="order-item-info">
                  <div class="order-item-name">${escapeHtml(item.name)}</div>
                  <div class="order-item-meta">${escapeHtml(item.duration)}</div>
                </div>
                <div class="order-item-price">¥${price * quantity}</div>
              </div>
            </div>
          `;
          }).join('')}
        </div>

        <div class="checkout-grid">
          <div>
            <div class="payment-info">
              <h4>微信支付说明</h4>
              <p>1. 请联系微信号 <span class="wechat-id">xpcustomer</span> 获取付款验证码</p>
              <p>2. 付款时请备注您的用户名以便核实</p>
              <p>3. 验证通过后，系统将自动确认您的订单</p>
            </div>

            <div class="checkout-card">
              <h3>输入验证码</h3>
              <div class="message" id="message"></div>
              <div class="verification-form">
                <input type="text" id="verification-code" placeholder="请输入5位验证码" maxlength="5">
                <button class="btn-wechat" onclick="verifyPayment()">验证支付</button>
              </div>
            </div>
          </div>

          <div>
            <div class="checkout-card">
              <h3>订单信息</h3>
              <div style="margin-bottom: 10px;">
                <span style="color: var(--text-light);">下单时间：</span>
                <span>${new Date().toLocaleString()}</span>
              </div>
              <div>
                <span style="color: var(--text-light);">订单状态：</span>
                <span style="color: #ff9800; font-weight: 600;">待支付</span>
              </div>
            </div>

            <div style="margin-top: 20px;">
              <a href="/" style="display: block; text-align: center; padding: 12px; color: var(--text-light); text-decoration: none;">继续购物</a>
            </div>
          </div>
        </div>
      `;
    }

    async function verifyPayment() {
      const code = document.getElementById('verification-code').value.trim();
      if (!code) {
        showMessage('请输入验证码', 'error');
        return;
      }

      // 验证所有订单
      let verifiedCount = 0;
      let failedCount = 0;
      const verifiedItems = [];

      for (const order of currentOrders) {
        try {
          const response = await fetch('/api/orders/' + order.id + '/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ verificationCode: code }),
            credentials: 'include'
          });

          if (response.ok) {
            verifiedCount++;
            verifiedItems.push({
              productId: order.item.productId,
              tierIndex: order.item.tierIndex
            });
          } else {
            failedCount++;
          }
        } catch (error) {
          failedCount++;
        }
      }

      if (verifiedCount > 0) {
        // 只移除已支付的项；下单失败而留下的项继续留在购物车里
        removeSucceededFromCart(verifiedItems);
        showMessage(`验证成功！${verifiedCount}个订单已支付！`, 'success');
        setTimeout(() => {
          window.location.href = '/user-center';
        }, 2000);
      } else {
        showMessage('验证码错误', 'error');
      }
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      if (msg) {
        msg.textContent = text;
        msg.className = 'message ' + type;
      }
    }

    document.addEventListener('DOMContentLoaded', loadCheckout);
  </script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    function toggleEmailSubscribe(e) {
      e.preventDefault();
      const modal = document.getElementById('subscribe-modal');
      if (modal) {
        modal.classList.add('active');
      }
    }

    function closeSubscribeModal() {
      const modal = document.getElementById('subscribe-modal');
      if (modal) {
        modal.classList.remove('active');
      }
    }

    </script>

  <script src="/js/header-auth.js" defer></script>
