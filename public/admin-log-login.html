<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博铭科技 - 登录日志</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/themes/theme-variables.css">
  <link rel="stylesheet" href="/css/pages/admin.css?v=20260623-1503">
  <link rel="stylesheet" href="/css/admin-theme.css?v=20260623-1503">
  <link rel="stylesheet" href="/css/admin-sidebar.css?v=20260622-1700">
  <!-- 安全渲染工具：转义 / 地址白名单的唯一事实来源（public/js/safe-html.js） -->
  <script src="/js/safe-html.js?v=1"></script>
</head>
<body>
  <div class="admin-layout">
    <main class="admin-main">
    <div class="admin-header">
      <h1>登录日志</h1>
      <div class="admin-actions">
        <a href="/admin-overview" class="btn btn-outline btn-small">返回概览</a>
      </div>
    </div>

    <div class="form-card">
      <table class="log-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>IP地址</th>
            <th>状态</th>
            <th>时间</th>
          </tr>
        </thead>
        <tbody id="logs-table">
          <tr><td colspan="5" style="text-align: center; padding: 40px;">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </main></div>

  <script>
    /**
     * HTML 转义 —— 统一走 SafeHtml（public/js/safe-html.js），那里是唯一事实来源。
     *
     * 原实现（div.textContent → innerHTML）只转义 & < >、**不转义引号**，
     * 放在属性上下文里形同虚设；`if (!text) return ''` 还会把数字 0 变成空串。
     */
    function escapeHtml(text) {
      return SafeHtml.escapeHtml(text);
    }

    // 加载设置
    async function loadSettings() {
      try {
        const response = await fetch('/api/settings', { credentials: 'include' });
        const settings = await response.json();

        if (settings.companyName) {
          document.getElementById('header-logo-text').textContent = ' ' + settings.companyName + ' 管理后台';
        }

        // Logo 地址先过白名单再转义 —— 管理员可控的字段不能直接拼进 HTML。
        const logoUrl = SafeHtml.escapeHtml(SafeHtml.safeImageUrl(settings.logo));
        if (logoUrl) {
          document.getElementById('header-logo-icon').outerHTML =
            '<img src="' + logoUrl + '?t=' + Date.now() + '" alt="Logo" id="header-logo-icon" style="height:40px;width:auto;">';
        }

        // 应用主题
        if (settings.siteTheme) {
          document.documentElement.setAttribute('data-theme', settings.siteTheme);
        }
      } catch (error) {
        console.error('Error loading settings:', error);
      }
    }

    async function loadLogs() {
      try {
        const response = await fetch('/api/logs/login', { credentials: 'include' });
        if (!response.ok) {
          if (response.status === 401) {
            window.location.href = '/login';
            return;
          }
          throw new Error('请求失败: ' + response.status);
        }
        const logs = await response.json();

        const tbody = document.getElementById('logs-table');

        if (!logs || logs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px;">暂无登录记录</td></tr>';
          return;
        }

        tbody.innerHTML = logs.map(log => {
          const statusClass = log.status === 'SUCCESS' ? 'success' : log.status === 'FAILED' ? 'failed' : 'warning';
          return `
            <tr>
              <td>${escapeHtml(String(log.id))}</td>
              <td>${escapeHtml(log.username)}</td>
              <td>${escapeHtml(log.ip)}</td>
              <td><span class="status ${statusClass}">${escapeHtml(log.status)}</span></td>
              <td>${escapeHtml(new Date(log.createdAt).toLocaleString('zh-CN'))}</td>
            </tr>
          `;
        }).join('');
      } catch (error) {
        console.error('Error loading logs:', error);
        document.getElementById('logs-table').innerHTML =
          '<tr><td colspan="5" style="text-align: center; padding: 40px; color: red;">加载失败</td></tr>';
      }
    }

    // 侧边栏子菜单切换
    function toggleSidebarSubmenu(link) {
      const submenu = link.nextElementSibling;
      if (submenu && submenu.classList.contains('sidebar-submenu')) {
        submenu.classList.toggle('open');
        link.classList.toggle('open');
      }
    }

    // 高亮当前页面
    const currentPath = window.location.pathname;
    document.querySelectorAll('.sidebar-nav a').forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPath || href === currentPath + '/') {
        link.classList.add('active');
        const submenu = link.closest('.sidebar-submenu');
        if (submenu) {
          submenu.classList.add('open');
          const parentLink = submenu.previousElementSibling;
          if (parentLink) parentLink.classList.add('open');
        }
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      loadLogs();
    });
  </script>
  <script src="/js/admin-theme.js" defer></script>
  <script src="/js/lucide-icons.js"></script>
  <script src="/js/admin-sidebar.js?v=20260622-2300" defer></script>
</body>
</html>
