<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博铭科技 - 产品管理</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/themes/theme-variables.css">
  <link rel="stylesheet" href="/css/pages/admin.css?v=20260623-1503">
  <link rel="stylesheet" href="/css/admin-theme.css?v=20260623-1503">
  <link rel="stylesheet" href="/css/admin-sidebar.css?v=20260622-1700">
  <link rel="stylesheet" href="/css/admin-product-form.css?v=20260622-1000">
  <link rel="stylesheet" href="/css/admin-product-modal.css?v=20260622-1000">
  <!-- DOMPurify 必须同步加载：不能依赖 defer，否则可能 window.DOMPurify 未就绪导致净化回退到纯文本 -->
  <script src="/vendor/dompurify/3.0.6/purify.min.js"></script>
  <!-- 安全渲染工具：转义 / 地址白名单的唯一事实来源（public/js/safe-html.js） -->
  <script src="/js/safe-html.js?v=1"></script>
</head>
<body>
  <div class="admin-layout">
    <main class="admin-main">
      <div class="page-header">
        <h1>产品管理</h1>
        <div class="actions">
          <a href="/" class="btn btn-secondary">查看网站</a>
          <button class="btn btn-primary" id="add-product-btn">+ 添加产品</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="number" id="total-products">0</div>
          <div class="label">全部产品</div>
        </div>
        <div class="stat-card">
          <div class="number" id="featured-products">0</div>
          <div class="label">精选产品</div>
        </div>
        <div class="stat-card">
          <div class="number" id="total-value">¥0</div>
          <div class="label">产品总值</div>
        </div>
        <div class="stat-card">
          <div class="number" id="categories">0</div>
          <div class="label">产品分类</div>
        </div>
      </div>

      <div class="card">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>名称</th>
              <th>简写</th>
              <th>分类</th>
              <th>价格方案</th>
              <th>版本</th>
              <th>平台</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="products-table">
            <tr><td colspan="9" class="empty-state">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="productModal" class="product-modal-backdrop" hidden>
    <div class="product-modal">
      <button type="button" class="product-modal-close" id="product-modal-close">&times;</button>
      <div id="productFormMount" class="product-form-shell">
        <p style="text-align: center; color: var(--text-light); padding: 40px;">加载中...</p>
      </div>
    </div>
  </div>

  <script>
    /**
     * HTML 转义 —— 统一走 SafeHtml（public/js/safe-html.js）。
     *
     * 原来的实现（div.textContent → innerHTML）只转义 & < >、**不转义引号**，
     * 被拼进属性上下文时形同虚设；而且 `if (!text) return ''` 会把数字 0 变成空串。
     * SafeHtml.escapeHtml 两种上下文都安全，且保留 0。
     */
    function escapeHtml(text) {
      return SafeHtml.escapeHtml(text);
    }

    // 分类名 → badge CSS class
    function getCategoryBadgeClass(category) {
      const map = {
        '企业产品': 'badge-enterprise-product',
        '外站课程': 'badge-external-course',
        '企业内训': 'badge-enterprise-internal',
        'GitHub 仓库': 'badge-github-repo',
        '开源产品': 'badge-open-source'
      };
      return map[category] || 'badge-neutral';
    }

    let products = [];

    async function loadSettings() {
      try {
        const response = await fetch('/api/settings', { credentials: 'include' });
        if (!response.ok) {
          if (response.status === 401) {
            window.location.href = '/login';
            return;
          }
        }
        const settings = await response.json();
        if (settings.companyName) {
          document.getElementById('header-logo-text').textContent = ' ' + settings.companyName + ' 管理后台';
          document.title = settings.companyName + ' - 产品管理';
        }
        // Logo 地址先过白名单再转义 —— 管理员可控的字段不能直接拼进 HTML。
        const logoUrl = SafeHtml.escapeHtml(SafeHtml.safeImageUrl(settings.logo));
        if (logoUrl) {
          document.getElementById('header-logo-icon').outerHTML =
            '<img src="' + logoUrl + '?t=' + Date.now() + '" alt="Logo" id="header-logo-icon" style="height:40px;width:auto;">';
        }
        if (settings.siteTheme) {
          document.documentElement.setAttribute('data-theme', settings.siteTheme);
        }
      } catch (error) {
        console.error('Error loading settings:', error);
      }
    }

    async function loadProducts() {
      try {
        // 用后台接口：/api/products 只返回已上架的产品，草稿在这里也要看到
        const response = await fetch('/api/admin/products?pageSize=100', { credentials: 'include' });
        if (!response.ok) {
          if (response.status === 401) {
            window.location.href = '/login';
            return;
          }
        }
        const data = await response.json();
        // 兼容两种返回格式: 旧版 array, 新版 {products, total, page, pageSize, totalPages}
        products = Array.isArray(data) ? data : (data.products || []);
        renderTable();
        updateStats();
      } catch (error) {
        console.error('Error loading products:', error);
        document.getElementById('products-table').innerHTML =
          '<tr><td colspan="9" class="empty-state" style="color:#ef4444;">加载失败</td></tr>';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('products-table');
      if (!products || products.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty-state">暂无产品</td></tr>';
        return;
      }
      tbody.innerHTML = products.map(product => {
        const savedTiers = product.pricingTiers || product.pricing_tiers;
        const hasTiers = savedTiers && savedTiers.length > 0;
        let priceDisplay;
        if (product.isCourse === true || product.isCourse === 1) {
          const linkCount = (product.courseLinks || []).length;
          priceDisplay = `<span class="badge badge-purple">课程型</span><br><small style="color:#64748b;">${linkCount} 个链接</small>`;
        } else if (hasTiers) {
          // tier.label / tier.price 是**可写进库的**字段（后台表单 / MCP / db-import
          // 都能写），product-list.html 里同名字段是转义过的，这里原先漏了 ——
          // 一个 <img onerror> 就能在后台列表里执行脚本。统一转义。
          const tierPrices = savedTiers
            .map(t => escapeHtml(t.label) + ':¥' + escapeHtml(t.price))
            .join(' / ');
          priceDisplay = `<span class="badge badge-info">多方案</span><br><small style="color:#64748b;">${tierPrices}</small>`;
        } else {
          priceDisplay = '¥' + escapeHtml(product.price);
        }
        // status：published = 已上架（前台可见），draft = 草稿（前台不可见）
        const isPublished = product.status === 'published';
        const statusBadge = isPublished
          ? '<span class="badge badge-success">已上架</span>'
          : '<span class="badge badge-warning">草稿</span>';
        // 上架 / 下架 / 删除都改成 data-* + 事件委托：
        // 内联 onclick 里插值要先过 HTML 转义，而 HTML 实体在 JS 编译**之前**
        // 就会被浏览器还原 —— 插值本身就不该出现在可执行字符串里。
        const toggleBtn = isPublished
          ? `<button class="btn-secondary btn-small" data-toggle-id="${escapeHtml(product.id)}" data-published="0">下架</button>`
          : `<button class="btn-success btn-small" data-toggle-id="${escapeHtml(product.id)}" data-published="1">上架</button>`;
        return `
          <tr>
            <td>${escapeHtml(product.id)}</td>
            <td><strong>${escapeHtml(product.name)}</strong></td>
            <td><code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;">${escapeHtml(product.shortName || '-')}</code></td>
            <td><span class="badge ${getCategoryBadgeClass(product.category)}">${escapeHtml(product.category)}</span></td>
            <td>${priceDisplay}</td>
            <td>${escapeHtml(product.version)}</td>
            <td>${escapeHtml(product.platform)}</td>
            <td>${statusBadge}</td>
            <td class="table-actions">
              <button class="btn-edit" data-edit-id="${escapeHtml(product.id)}">编辑</button>
              ${toggleBtn}
              <button class="btn-delete" data-delete-id="${escapeHtml(product.id)}">删除</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function updateStats() {
      const total = products.length;
      const featured = products.filter(p => p.featured).length;
      const totalValue = products.reduce((sum, p) => sum + p.price, 0);
      const categories = [...new Set(products.map(p => p.category))].length;
      document.getElementById('total-products').textContent = total;
      document.getElementById('featured-products').textContent = featured;
      document.getElementById('total-value').textContent = '¥' + totalValue;
      document.getElementById('categories').textContent = categories;
    }

    async function deleteProduct(id) {
      if (!confirm('确定要删除此产品吗？')) return;
      try {
        const response = await fetch(`/api/products/${id}`, { method: 'DELETE', credentials: 'include' });
        if (!response.ok) {
          if (response.status === 401) {
            window.location.href = '/login';
            return;
          }
          Toast.error('删除产品失败');
          return;
        }
        Toast.success('产品删除成功');
        loadProducts();
      } catch (error) {
        console.error('Error deleting product:', error);
        Toast.error('删除产品时出错');
      }
    }

    /**
     * 上架 / 下架产品。
     * 上架是**人工专属**动作 —— MCP 侧没有对应工具，AI 建出来的产品只能由人在这里放行。
     */
    async function toggleProductStatus(id, published) {
      const action = published ? '上架' : '下架';
      const confirmMsg = published
        ? `确定上架产品 #${id} 吗？上架后前台立即可见。`
        : `确定下架产品 #${id} 吗？下架后前台立即不可见。`;
      if (!confirm(confirmMsg)) return;
      try {
        const endpoint = published ? 'publish' : 'unpublish';
        const response = await fetch(`/api/admin/products/${id}/${endpoint}`, {
          method: 'POST',
          credentials: 'include'
        });
        if (!response.ok) {
          if (response.status === 401) {
            window.location.href = '/login';
            return;
          }
          let message = `${action}失败`;
          try {
            const body = await response.json();
            if (body && body.error) message = body.error;
          } catch (parseError) {
            // 响应体不是 JSON 时保留默认文案
          }
          Toast.error(message);
          return;
        }
        Toast.success(`产品已${action}`);
        loadProducts();
      } catch (error) {
        console.error('Error toggling product status:', error);
        Toast.error(`${action}产品时出错`);
      }
    }

    function toggleSidebarSubmenu(link) {
      const submenu = link.nextElementSibling;
      if (submenu && submenu.classList.contains('sidebar-submenu')) {
        submenu.classList.toggle('open');
        link.classList.toggle('open');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      loadProducts();

      // === Modal: 加载并打开产品表单 ===
      let productFormInstance = null;

      function loadScriptOnce(src) {
        return new Promise(function(resolve, reject) {
          if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = function() { reject(new Error('Failed to load ' + src)); };
          document.head.appendChild(s);
        });
      }

      async function openProductModal(mode, productId) {
        productId = productId || null;
        const modal = document.getElementById('productModal');
        const mount = document.getElementById('productFormMount');

        // 先显示 modal（让用户立刻看到反馈）
        modal.hidden = false;
        document.body.style.overflow = 'hidden';

        try {
          // 每次打开都重新 fetch HTML 并重新挂载 partial，
          // 这样避免上次打开的字段值残留在表单里
          if (productFormInstance) {
            productFormInstance.destroy();
            productFormInstance = null;
          }

          const html = await fetch('/admin-product-form.html?v=20260626-2100').then(function(r) { return r.text(); });
          mount.innerHTML = html;

          // JS script 只在首次加载时挂到 head
          if (!window.ProductForm) {
            await loadScriptOnce('/js/admin-product-form.js?v=20260626-2100');
          }

          productFormInstance = window.ProductForm.init(mount, {
            mode: mode,
            productId: productId,
            onSaved: function() {
              closeProductModal();
              loadProducts();
            },
            onCancel: closeProductModal
          });
        } catch (err) {
          console.error('Modal open error:', err);
          Toast.error('表单加载失败');
          closeProductModal();
        }
      }

      function closeProductModal() {
        const modal = document.getElementById('productModal');
        modal.hidden = true;
        document.body.style.overflow = '';
        if (productFormInstance) {
          productFormInstance.destroy();
          productFormInstance = null;
        }
      }

      // 事件绑定
      document.getElementById('add-product-btn').addEventListener('click', function() {
        openProductModal('create');
      });
      document.getElementById('product-modal-close').addEventListener('click', closeProductModal);
      document.getElementById('productModal').addEventListener('click', function(e) {
        // 点击 backdrop 关闭（点击 modal 内容不关）
        if (e.target === this) closeProductModal();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !document.getElementById('productModal').hidden) {
          closeProductModal();
        }
      });
      // 行内按钮统一走事件委托：renderTable 只拼 data-* 属性，不拼 onclick。
      document.getElementById('products-table').addEventListener('click', function(e) {
        const editBtn = e.target.closest('button[data-edit-id]');
        if (editBtn) {
          openProductModal('edit', parseInt(editBtn.dataset.editId, 10));
          return;
        }
        const toggleBtn = e.target.closest('button[data-toggle-id]');
        if (toggleBtn) {
          toggleProductStatus(
            parseInt(toggleBtn.dataset.toggleId, 10),
            toggleBtn.dataset.published === '1'
          );
          return;
        }
        const deleteBtn = e.target.closest('button[data-delete-id]');
        if (deleteBtn) {
          deleteProduct(parseInt(deleteBtn.dataset.deleteId, 10));
        }
      });

      // Highlight current page in sidebar
      const currentPath = window.location.pathname;
      document.querySelectorAll('.sidebar-nav a').forEach(link => {
        const href = link.getAttribute('href');
        if (href === currentPath) {
          link.classList.add('active');
          const submenu = link.closest('.sidebar-submenu');
          if (submenu) {
            submenu.classList.add('open');
            const parentLink = submenu.previousElementSibling;
            if (parentLink) parentLink.classList.add('open');
          }
        }
      });
    });
  </script>
  <script src="/js/toast.js?v=20260626-2100" defer></script>
  <script src="/js/admin-theme.js?v=20260626-2100" defer></script>
  <script src="/js/lucide-icons.js"></script>
  <script src="/js/admin-sidebar.js?v=20260622-2300" defer></script>
</body>
</html>
